asyncapi: 3.0.0
info:
  title: Codestra Canonical Events
  version: 0.1.0
  description: Canonical CloudEvents emitted only after inbox validation and durable state transition.
defaultContentType: application/json
channels:
  socialPostStatus:
    address: codestra.social.post.status.v1
    messages:
      socialPostStatusChanged:
        $ref: '#/components/messages/SocialPostStatusChanged'
  webhookDeliveryStatus:
    address: codestra.webhook.delivery.status.v1
    messages:
      webhookDeliveryStatusChanged:
        $ref: '#/components/messages/WebhookDeliveryStatusChanged'
  communicationMessageStatus:
    address: codestra.communications.message.status.v1
    description: Normalized lifecycle updates for email, SMS, and voice messages.
    messages:
      communicationMessageStatusChanged:
        $ref: '#/components/messages/CommunicationMessageStatusChanged'
  communicationMessageEvent:
    address: codestra.communications.message.event.v1
    description: Normalized provider event evidence for one communications message.
    messages:
      communicationMessageEventRecorded:
        $ref: '#/components/messages/CommunicationMessageEventRecorded'
  communicationReputationChanged:
    address: codestra.communications.reputation.changed.v1
    description: Tenant, domain, or provider reputation changed.
    messages:
      communicationReputationChanged:
        $ref: '#/components/messages/CommunicationReputationChanged'
  communicationProviderHealthChanged:
    address: codestra.communications.provider.health.changed.v1
    description: Provider health changed for email, SMS, or voice delivery.
    messages:
      communicationProviderHealthChanged:
        $ref: '#/components/messages/CommunicationProviderHealthChanged'
  call_disposition_updated:
    address: codestra.events.call_disposition_updated
    description: >
      Published by Middleware when a VICIdial call result has been written
      to the Odoo contact record. Subscribers receive call outcome data
      without accessing VICIdial or Odoo directly.
    messages:
      CallDispositionUpdated:
        $ref: '#/components/messages/CallDispositionUpdated'
  sms_received:
    address: codestra.events.sms_received
    description: >
      Published by Middleware when an inbound SMS from a customer has been
      written to the Odoo contact chatter. Subscribers receive the message
      preview and contact reference without accessing Telnexa or Odoo directly.
    messages:
      SmsReceived:
        $ref: '#/components/messages/SmsReceived'
  integration:
    address: codestra.integration.events
    x-codestra-exposure: internal
    messages:
      event:
        $ref: '#/components/messages/integration'
  klyrow:
    address: codestra.klyrow.events
    x-codestra-exposure: internal
    messages:
      event:
        $ref: '#/components/messages/klyrow'
  telnexa:
    address: codestra.telnexa.events
    x-codestra-exposure: internal
    messages:
      event:
        $ref: '#/components/messages/telnexa'
  vicidial:
    address: codestra.vicidial.events
    x-codestra-exposure: internal
    messages:
      event:
        $ref: '#/components/messages/vicidial'
operations:
  receiveSocialPostStatus:
    action: receive
    channel:
      $ref: '#/channels/socialPostStatus'
  receiveWebhookDeliveryStatus:
    action: receive
    channel:
      $ref: '#/channels/webhookDeliveryStatus'
  receiveCommunicationMessageStatus:
    action: receive
    channel:
      $ref: '#/channels/communicationMessageStatus'
  receiveCommunicationMessageEvent:
    action: receive
    channel:
      $ref: '#/channels/communicationMessageEvent'
  receiveCommunicationReputationChanged:
    action: receive
    channel:
      $ref: '#/channels/communicationReputationChanged'
  receiveCommunicationProviderHealthChanged:
    action: receive
    channel:
      $ref: '#/channels/communicationProviderHealthChanged'
  receiveCallDispositionUpdated:
    action: receive
    channel:
      $ref: '#/channels/call_disposition_updated'
  receiveSmsReceived:
    action: receive
    channel:
      $ref: '#/channels/sms_received'
  receive_integration:
    action: receive
    channel:
      $ref: '#/channels/integration'
  receive_klyrow:
    action: receive
    channel:
      $ref: '#/channels/klyrow'
  receive_telnexa:
    action: receive
    channel:
      $ref: '#/channels/telnexa'
  receive_vicidial:
    action: receive
    channel:
      $ref: '#/channels/vicidial'
components:
  messages:
    SocialPostStatusChanged:
      name: codestra.social.post.status.v1
      title: Social post status changed
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: codestra.social.post.status.v1 }
              data:
                $ref: '../schemas/events/social-post-status.schema.json'
    WebhookDeliveryStatusChanged:
      name: codestra.webhook.delivery.status.v1
      title: Webhook delivery status changed
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: codestra.webhook.delivery.status.v1 }
              data:
                type: object
                additionalProperties: false
                required: [deliveryId, endpointId, status, occurredAt]
                properties:
                  deliveryId: { type: string, format: uuid }
                  endpointId: { type: string, format: uuid }
                  status: { type: string, enum: [queued, attempting, delivered, failed, dead_lettered] }
                  attempt: { type: integer, minimum: 0 }
                  occurredAt: { type: string, format: date-time }
    CommunicationMessageStatusChanged:
      name: codestra.communications.message.status.v1
      title: Communication message status changed
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: codestra.communications.message.status.v1 }
              data:
                $ref: '#/components/schemas/CommunicationMessageStatusPayload'
    CommunicationMessageEventRecorded:
      name: codestra.communications.message.event.v1
      title: Communication message event recorded
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: codestra.communications.message.event.v1 }
              data:
                $ref: '#/components/schemas/CommunicationMessageEventPayload'
    CommunicationReputationChanged:
      name: codestra.communications.reputation.changed.v1
      title: Communication reputation changed
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: codestra.communications.reputation.changed.v1 }
              data:
                $ref: '#/components/schemas/CommunicationReputationPayload'
    CommunicationProviderHealthChanged:
      name: codestra.communications.provider.health.changed.v1
      title: Communication provider health changed
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: codestra.communications.provider.health.changed.v1 }
              data:
                $ref: '#/components/schemas/CommunicationProviderHealthPayload'
    CallDispositionUpdated:
      name: CallDispositionUpdated
      title: Call disposition updated
      summary: VICIdial call result written to Odoo
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CallDispositionUpdatedPayload'
    SmsReceived:
      name: SmsReceived
      title: SMS received
      summary: Inbound customer SMS written to Odoo chatter
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SmsReceivedPayload'
    integration:
      name: integrationBusinessEvent
      payload:
        additionalProperties: false
        properties:
          causation_id:
            maxLength: 200
            minLength: 1
            title: Causation Id
            type: string
          correlation_id:
            maxLength: 200
            minLength: 1
            title: Correlation Id
            type: string
          data:
            additionalProperties: true
            title: Data
            type: object
          id:
            maxLength: 200
            minLength: 1
            title: Id
            type: string
          occurred_at:
            format: date-time
            title: Occurred At
            type: string
          source:
            const: integration
          tenant_id:
            maxLength: 200
            minLength: 1
            title: Tenant Id
            type: string
          type:
            maxLength: 120
            pattern: ^[a-z]+\.[a-z][a-z0-9_.]+$
            title: Type
            type: string
          version:
            const: 1
            default: 1
            title: Version
            type: integer
        required:
        - id
        - type
        - source
        - tenant_id
        - correlation_id
        - causation_id
        - occurred_at
        - data
        title: EventEnvelope
        type: object
    klyrow:
      name: klyrowBusinessEvent
      payload:
        additionalProperties: false
        properties:
          causation_id:
            maxLength: 200
            minLength: 1
            title: Causation Id
            type: string
          correlation_id:
            maxLength: 200
            minLength: 1
            title: Correlation Id
            type: string
          data:
            additionalProperties: true
            title: Data
            type: object
          id:
            maxLength: 200
            minLength: 1
            title: Id
            type: string
          occurred_at:
            format: date-time
            title: Occurred At
            type: string
          source:
            const: klyrow
          tenant_id:
            maxLength: 200
            minLength: 1
            title: Tenant Id
            type: string
          type:
            enum:
            - klyrow.tenant.created
            - klyrow.subscription.changed
            - klyrow.email.accepted
            - klyrow.email.delivered
            - klyrow.email.bounced
            - klyrow.email.complained
            - klyrow.campaign.summary
            - klyrow.usage.daily
            - klyrow.kpi.daily
            - klyrow.domain.status
            - klyrow.provider.health
            - klyrow.account.held
            maxLength: 120
            pattern: ^[a-z]+\.[a-z][a-z0-9_.]+$
            title: Type
            type: string
          version:
            const: 1
            default: 1
            title: Version
            type: integer
        required:
        - id
        - type
        - source
        - tenant_id
        - correlation_id
        - causation_id
        - occurred_at
        - data
        title: EventEnvelope
        type: object
    telnexa:
      name: telnexaBusinessEvent
      payload:
        additionalProperties: false
        properties:
          causation_id:
            maxLength: 200
            minLength: 1
            title: Causation Id
            type: string
          correlation_id:
            maxLength: 200
            minLength: 1
            title: Correlation Id
            type: string
          data:
            additionalProperties: true
            title: Data
            type: object
          id:
            maxLength: 200
            minLength: 1
            title: Id
            type: string
          occurred_at:
            format: date-time
            title: Occurred At
            type: string
          source:
            const: telnexa
          tenant_id:
            maxLength: 200
            minLength: 1
            title: Tenant Id
            type: string
          type:
            maxLength: 120
            pattern: ^[a-z]+\.[a-z][a-z0-9_.]+$
            title: Type
            type: string
          version:
            const: 1
            default: 1
            title: Version
            type: integer
        required:
        - id
        - type
        - source
        - tenant_id
        - correlation_id
        - causation_id
        - occurred_at
        - data
        title: EventEnvelope
        type: object
    vicidial:
      name: vicidialBusinessEvent
      payload:
        additionalProperties: false
        properties:
          causation_id:
            maxLength: 200
            minLength: 1
            title: Causation Id
            type: string
          correlation_id:
            maxLength: 200
            minLength: 1
            title: Correlation Id
            type: string
          data:
            additionalProperties: true
            title: Data
            type: object
          id:
            maxLength: 200
            minLength: 1
            title: Id
            type: string
          occurred_at:
            format: date-time
            title: Occurred At
            type: string
          source:
            const: vicidial
          tenant_id:
            maxLength: 200
            minLength: 1
            title: Tenant Id
            type: string
          type:
            maxLength: 120
            pattern: ^[a-z]+\.[a-z][a-z0-9_.]+$
            title: Type
            type: string
          version:
            const: 1
            default: 1
            title: Version
            type: integer
        required:
        - id
        - type
        - source
        - tenant_id
        - correlation_id
        - causation_id
        - occurred_at
        - data
        title: EventEnvelope
        type: object
  schemas:
    CloudEventEnvelope:
      type: object
      additionalProperties: false
      required: [specversion, id, source, type, time, datacontenttype, data]
      properties:
        specversion: { const: '1.0' }
        id: { type: string, format: uuid }
        source: { type: string, format: uri-reference }
        type: { type: string }
        subject: { type: string }
        time: { type: string, format: date-time }
        datacontenttype: { const: application/json }
        dataschema: { type: string, format: uri }
        data: {}
    CommunicationChannel:
      type: string
      enum: [email, sms, voice]
    CommunicationMessageStatus:
      type: string
      enum: [accepted, queued, dispatched, delivered, failed, cancelled, suppressed, expired, indeterminate]
    CommunicationMessageStatusPayload:
      type: object
      additionalProperties: false
      required:
        - messageId
        - tenantId
        - channel
        - status
        - correlationId
        - occurredAt
      properties:
        messageId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 128 }
        channel: { $ref: '#/components/schemas/CommunicationChannel' }
        previousStatus: { $ref: '#/components/schemas/CommunicationMessageStatus' }
        status: { $ref: '#/components/schemas/CommunicationMessageStatus' }
        correlationId: { type: string, minLength: 1, maxLength: 180 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 180 }
        provider: { type: [string, 'null'] }
        providerReference: { type: [string, 'null'] }
        failureCode: { type: [string, 'null'] }
        failureMessage: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
    CommunicationMessageEventPayload:
      type: object
      additionalProperties: false
      required:
        - eventId
        - messageId
        - tenantId
        - channel
        - status
        - correlationId
        - occurredAt
      properties:
        eventId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 128 }
        channel: { $ref: '#/components/schemas/CommunicationChannel' }
        status: { $ref: '#/components/schemas/CommunicationMessageStatus' }
        provider: { type: [string, 'null'] }
        providerEventType: { type: [string, 'null'] }
        providerReference: { type: [string, 'null'] }
        correlationId: { type: string, minLength: 1, maxLength: 180 }
        occurredAt: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
    CommunicationReputationPayload:
      type: object
      additionalProperties: false
      required: [tenantId, status, scope, occurredAt]
      properties:
        tenantId: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [good, watch, limited, suspended] }
        scope: { type: string, enum: [tenant, domain, provider] }
        domain: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    CommunicationProviderHealthPayload:
      type: object
      additionalProperties: false
      required: [tenantId, provider, channel, status, occurredAt]
      properties:
        tenantId: { type: string, minLength: 1, maxLength: 128 }
        provider: { type: string }
        channel: { $ref: '#/components/schemas/CommunicationChannel' }
        status: { type: string, enum: [healthy, degraded, unavailable, disabled] }
        reason: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    CallDispositionUpdatedPayload:
      type: object
      required:
        - event_type
        - correlation_id
        - causation_id
        - disposition
        - phone_number
        - provider_call_id
      properties:
        event_type:
          type: string
          const: call_disposition_updated
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type: string
          description: Provider call ID that caused this event
        odoo_contact_id:
          type: [integer, 'null']
          description: Odoo res.partner ID — null if contact could not be matched
        odoo_lead_id:
          type: [integer, 'null']
          description: Odoo crm.lead ID — null if no active lead for contact
        disposition:
          type: string
          enum:
            - answered
            - no_answer
            - busy
            - voicemail
            - dnc
            - callback_requested
            - sale_completed
            - failed
            - dropped
            - not_interested
            - unknown
        phone_number:
          type: string
          description: E.164 format phone number
        duration_seconds:
          type: integer
          minimum: 0
        campaign_id:
          type: [string, 'null']
        provider_call_id:
          type: string
          description: VICIdial call ID (uniqueid)
        dry_run:
          type: boolean
          description: True when ODOO_WRITE=false — event published but Odoo not written
    SmsReceivedPayload:
      type: object
      required:
        - event_type
        - correlation_id
        - causation_id
        - from_number
        - body_preview
        - provider_event_id
      properties:
        event_type:
          type: string
          const: sms_received
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type: string
          description: Telnexa message ID that caused this event
        odoo_contact_id:
          type: [integer, 'null']
          description: Odoo res.partner ID — null if phone not matched
        odoo_message_id:
          type: [integer, 'null']
          description: Odoo mail.message ID of the chatter entry
        from_number:
          type: string
          description: E.164 format sender phone number
        body_preview:
          type: string
          maxLength: 120
          description: First 120 characters of the SMS body
        provider_event_id:
          type: string
          description: Telnexa message ID
        dry_run:
          type: boolean
          description: True when ODOO_WRITE=false — event published but Odoo not written
