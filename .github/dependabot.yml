version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "maven"
    directory: "/services/camel-protocol-gateway"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/python/moneybee-connectors"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/services/middleware"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # No docker entry for services/camel-protocol-gateway: its Dockerfile's
  # FROM lines are bare ARG placeholders (MAVEN_IMAGE/RUNTIME_IMAGE),
  # resolved at build time from repository variables rather than a literal
  # image reference in the file -- Dependabot has nothing to scan there.
  # See docs/FEATURE_ROADMAP.md for tracking this separately.

  - package-ecosystem: "docker"
    directory: "/apps/admin-console"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/apps/developer-portal"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/apps/ops-dashboard"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
