name: Marketing SDK Stage 5

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect relevant changes
        id: changed
        run: |
          if [ -z "${{ github.event.pull_request.base.sha }}" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- \
              python/codestra_sdk/ tests/test_marketing_sdk_contract.py \
              .github/workflows/marketing-sdk-stage5.yml; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.any == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - if: steps.changed.outputs.any == 'true'
        run: python -m pip install --upgrade pip
      - if: steps.changed.outputs.any == 'true'
        run: pip install pytest httpx
      - if: steps.changed.outputs.any == 'true'
        run: PYTHONPATH=python python -m compileall -q python/codestra_sdk tests/test_marketing_sdk_contract.py
      - if: steps.changed.outputs.any == 'true'
        run: PYTHONPATH=python pytest -q tests/test_marketing_sdk_contract.py
      - if: steps.changed.outputs.any == 'true'
        run: PYTHONPATH=python python -c "from codestra_sdk.marketing import MarketingClient; from codestra_sdk.ai import AIClient; from codestra_sdk.communication import CommunicationClient; from codestra_sdk.social import SocialClient; assert MarketingClient and AIClient and CommunicationClient and SocialClient"
