name: Contract validation

on:
  pull_request:
  push:
    branches:
      - 'feat/01-contracts'

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REDOCLY_TELEMETRY: off
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect relevant changes
        id: changed
        run: |
          if [ -z "${{ github.event.pull_request.base.sha }}" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- \
              contracts/ packages/contracts/ scripts/validate-contracts.mjs \
              scripts/validate-json-schemas.mjs scripts/test-contract-validator.mjs \
              test/fixtures/contracts/ package.json pnpm-lock.yaml \
              .github/workflows/contracts.yml; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pnpm
        if: steps.changed.outputs.any == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - name: Set up Node.js
        if: steps.changed.outputs.any == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact dependencies
        if: steps.changed.outputs.any == 'true'
        run: pnpm install --frozen-lockfile
      - name: Validate canonical contracts semantically
        if: steps.changed.outputs.any == 'true'
        run: pnpm contracts:validate
      - name: Prove invalid contracts fail closed
        if: steps.changed.outputs.any == 'true'
        run: pnpm contracts:validate:negative
      - name: Type-check contract package
        if: steps.changed.outputs.any == 'true'
        run: pnpm --filter @codestra/contracts typecheck
      - name: Test contract package
        if: steps.changed.outputs.any == 'true'
        run: pnpm --filter @codestra/contracts test
