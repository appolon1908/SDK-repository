name: Generated SDKs

on:
  pull_request:
  push:
    branches:
      - 'feat/08-python-php-generation'

permissions:
  contents: read

concurrency:
  group: sdk-generation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENAPI_GENERATOR_VERSION: 7.15.0
  OPENAPI_GENERATOR_IMAGE: openapitools/openapi-generator-cli:v7.15.0
  REDOCLY_TELEMETRY: off
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect relevant changes
        id: changed
        run: |
          if [ -z "${{ github.event.pull_request.base.sha }}" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- \
              contracts/openapi/ codegen/ scripts/generate-sdks.sh \
              scripts/prepare-middleware-generator-contract.mjs scripts/verify-generated-sdks.mjs \
              scripts/smoke_test_python_sdk.py scripts/smoke_test_middleware_python_sdk.py \
              scripts/smoke_test_php_sdk.php scripts/validate-contracts.mjs \
              scripts/validate-json-schemas.mjs package.json pnpm-lock.yaml \
              .github/workflows/sdk-generation.yml; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pnpm
        if: steps.changed.outputs.any == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - name: Set up Node.js
        if: steps.changed.outputs.any == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact dependencies
        if: steps.changed.outputs.any == 'true'
        run: pnpm install --frozen-lockfile
      - name: Set up Python
        if: steps.changed.outputs.any == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up PHP
        if: steps.changed.outputs.any == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:2
      - name: Validate canonical contracts semantically
        if: steps.changed.outputs.any == 'true'
        run: pnpm contracts:validate
      - name: Generate public and Middleware clients and smoke-test all
        if: steps.changed.outputs.any == 'true'
        run: scripts/generate-sdks.sh
      - name: Archive exact-SHA clients
        if: steps.changed.outputs.any == 'true'
        run: |
          tar -C generated/python -czf "generated/codestra-python-${SOURCE_SHA}.tar.gz" .
          tar -C generated/php -czf "generated/codestra-php-${SOURCE_SHA}.tar.gz" .
          tar -C generated/middleware-python -czf "generated/codestra-middleware-python-${SOURCE_SHA}.tar.gz" .
          sha256sum generated/*.tar.gz > generated/SHA256SUMS
      - name: Upload generation evidence
        if: steps.changed.outputs.any == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-sdks-${{ env.SOURCE_SHA }}
          path: |
            generated/codestra-python-${{ env.SOURCE_SHA }}.tar.gz
            generated/codestra-php-${{ env.SOURCE_SHA }}.tar.gz
            generated/codestra-middleware-python-${{ env.SOURCE_SHA }}.tar.gz
            generated/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
