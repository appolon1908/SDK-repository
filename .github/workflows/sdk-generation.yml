name: Generated SDKs

on:
  pull_request:
    paths:
      - 'contracts/openapi/**'
      - 'codegen/**'
      - 'scripts/generate-sdks.sh'
      - 'scripts/verify-generated-sdks.mjs'
      - 'scripts/validate-contracts.mjs'
      - 'scripts/validate-json-schemas.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/sdk-generation.yml'
  push:
    branches:
      - 'feat/08-python-php-generation'

permissions:
  contents: read

concurrency:
  group: sdk-generation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENAPI_GENERATOR_VERSION: 7.15.0
  OPENAPI_GENERATOR_IMAGE: openapitools/openapi-generator-cli@sha256:509f01c3c7eee9d1ad286506a7b6aa4624a95b410be9a238a306d209e900621f
  REDOCLY_TELEMETRY: off
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate canonical contract semantically
        run: pnpm contracts:validate
      - name: Generate Python and PHP clients
        run: scripts/generate-sdks.sh
      - name: Archive exact-SHA clients
        run: |
          tar -C generated/python -czf "generated/codestra-python-${SOURCE_SHA}.tar.gz" .
          tar -C generated/php -czf "generated/codestra-php-${SOURCE_SHA}.tar.gz" .
          sha256sum generated/*.tar.gz > generated/SHA256SUMS
      - name: Upload generation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-sdks-${{ env.SOURCE_SHA }}
          path: |
            generated/codestra-python-${{ env.SOURCE_SHA }}.tar.gz
            generated/codestra-php-${{ env.SOURCE_SHA }}.tar.gz
            generated/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
