name: Publish Docker images

# Builds and pushes production images for every deployable service to GHCR.
# camel-protocol-gateway is intentionally excluded from the matrix: its
# Dockerfile requires immutable, sha256-digest-pinned base images supplied
# via MAVEN_IMAGE/RUNTIME_IMAGE build args (see
# services/camel-protocol-gateway/Dockerfile) -- this workflow will not
# fabricate a digest. Set the repository variables
# CAMEL_GATEWAY_MAVEN_IMAGE and CAMEL_GATEWAY_RUNTIME_IMAGE (Settings ->
# Secrets and variables -> Actions -> Variables) to enable its build job.

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Runs the same check as .github/workflows/calling-contract-pin.yml, in
  # this workflow, so build-and-push can `needs:` it directly -- a job in
  # one workflow file cannot depend on a job in another, so gating on the
  # separate workflow's push-triggered run (which only races this one) does
  # not actually stop a bad lock from being published.
  verify-calling-contract-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate calling-contract lock before publishing
        run: python3 scripts/validate_calling_contract_pin.py

  build-and-push:
    needs: verify-calling-contract-pin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: middleware
            dockerfile: services/middleware/Dockerfile
          - name: admin-console
            dockerfile: apps/admin-console/Dockerfile
          - name: developer-portal
            dockerfile: apps/developer-portal/Dockerfile
          - name: ops-dashboard
            dockerfile: apps/ops-dashboard/Dockerfile
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/codestra-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref_name == 'production' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  build-and-push-camel-gateway:
    needs: verify-calling-contract-pin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Skips cleanly (rather than failing the workflow) until both immutable
    # image references are configured as repository variables. See the
    # top-of-file comment for why this workflow never invents a digest.
    if: vars.CAMEL_GATEWAY_MAVEN_IMAGE != '' && vars.CAMEL_GATEWAY_RUNTIME_IMAGE != ''
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/codestra-camel-protocol-gateway
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref_name == 'production' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: services/camel-protocol-gateway
          file: services/camel-protocol-gateway/Dockerfile
          build-args: |
            MAVEN_IMAGE=${{ vars.CAMEL_GATEWAY_MAVEN_IMAGE }}
            RUNTIME_IMAGE=${{ vars.CAMEL_GATEWAY_RUNTIME_IMAGE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=camel-protocol-gateway
          cache-to: type=gha,mode=max,scope=camel-protocol-gateway
