name: calling-contract-pin

on:
  pull_request:
    paths:
      - ".codestra/calling-contract.lock.json"
      - ".github/workflows/calling-contract-pin.yml"
      - ".github/workflows/compatibility.yml"
      - "scripts/validate_calling_contract_pin.py"
  push:
    branches: ["development", "staging", "main", "production"]
    paths:
      - ".codestra/calling-contract.lock.json"
      - ".github/workflows/calling-contract-pin.yml"
      - ".github/workflows/compatibility.yml"
      - "scripts/validate_calling_contract_pin.py"

permissions:
  contents: read

jobs:
  verify:
    name: verify-head
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact source and validate lock
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"
          python3 scripts/validate_calling_contract_pin.py
          python3 scripts/validate_calling_contract_pin.py --self-test
          git diff --check

  verify-merge-result:
    name: verify-merge-result
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Check out synthetic merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove merge-result source and validate lock
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"
          python3 scripts/validate_calling_contract_pin.py
          git diff --check
