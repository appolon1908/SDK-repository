name: Compatibility gates

on:
  pull_request:
  push:
    branches:
      - 'feat/07-pact-contract-gates'

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REDOCLY_TELEMETRY: off
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate calling contract lock
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_calling_contract_pin.py
          python3 scripts/validate_calling_contract_pin.py --self-test
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate workflow security policy
        run: pnpm workflows:validate
      - name: Validate current contracts semantically
        run: pnpm contracts:validate
      - name: Verify canonical Middleware runtime alignment
        run: pnpm contracts:middleware
      - name: Prove Middleware authority gates fail closed
        run: pnpm contracts:middleware:negative
      - name: Prove the drift detector actually rejects breaking changes
        run: pnpm contracts:drift:negative
      - name: Reject breaking contract drift
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-$(git rev-parse HEAD^)}"
          pnpm contracts:drift "$BASE_SHA"
      - name: Build workspace dependencies
        run: pnpm --filter @codestra/contracts build && pnpm --filter @codestra/testing build
      - name: Generate consumer Pact
        run: pnpm --filter @codestra/social-sdk test:pact
      - name: Validate generated Pact
        run: pnpm pacts:validate
      - name: Upload Pact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-pacts-${{ github.event.pull_request.head.sha || github.sha }}
          path: pact/pacts/*.json
          if-no-files-found: error
          retention-days: 7
