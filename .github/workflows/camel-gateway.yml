name: Camel protocol gateway

on:
  pull_request:
    paths:
      - "services/camel-protocol-gateway/**"
      - ".github/workflows/camel-gateway.yml"
  push:
    branches: ["optional/10-camel-protocol-gateway"]
    paths:
      - "services/camel-protocol-gateway/**"
      - ".github/workflows/camel-gateway.yml"

permissions:
  contents: read

concurrency:
  group: camel-gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify gateway
        working-directory: services/camel-protocol-gateway
        run: mvn --batch-mode --no-transfer-progress verify
