name: Required gates

on:
  pull_request:
  push:
    branches: ["integration/v0.1"]

permissions:
  contents: read

concurrency:
  group: required-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  OPENAPI_GENERATOR_IMAGE: openapitools/openapi-generator-cli@sha256:509f01c3c7eee9d1ad286506a7b6aa4624a95b410be9a238a306d209e900621f
  SDK_REDIS_TEST_IMAGE: redis@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
  REDOCLY_TELEMETRY: off
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"

jobs:
  required-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run source and signed inbound evidence gates
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm workflows:validate
          pnpm contracts:validate
          pnpm contracts:validate:negative
          pnpm build
          pnpm typecheck
          pnpm test:coverage
          pnpm test:redis
          pnpm --filter @codestra/social-sdk test:pact
          pnpm pacts:validate
          scripts/generate-sdks.sh
          mvn --batch-mode --no-transfer-progress -f services/camel-protocol-gateway/pom.xml verify
          git diff --check
          test -z "$(git status --porcelain)"
