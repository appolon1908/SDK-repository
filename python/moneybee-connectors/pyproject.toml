[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codestra-moneybee-connectors"
version = "0.1.0"
description = "Fail-closed server-side connector contracts for MoneyBee and Codestra Middleware"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["httpx==0.28.1", "pydantic==2.13.5"]

[project.optional-dependencies]
test = [
  "cyclonedx-bom==7.5.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codestra_moneybee_connectors"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
